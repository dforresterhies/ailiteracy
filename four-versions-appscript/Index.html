<body><div id="app"><p class="muted">Loading…</p></div>
<script>
const INITIAL_SESSION=<?!= JSON.stringify(initialSession) ?>,ORDER=['A','B','C','D'];
const TYPES={
  A:{label:'All me',short:'A · All me',desc:'Your own answer, written by you. No AI.',how:'Write your answer in your own words. Do not use AI for this version.'},
  B:{label:'Straight AI',short:'B · Straight AI',desc:'First AI output, unchanged.',how:'Use an AI platform you already have access to. Start a new chat, give it the exact workshop prompt, and paste its first response here unchanged.'},
  C:{label:'AI, then me',short:'C · AI, then me',desc:'AI wrote it, you edited it to sound like you.',how:'Your Version B is loaded into the box below. Edit that text directly until it sounds like you: cut, rearrange, change wording, and add something you would actually say.'},
  D:{label:'Me, then AI',short:'D · Me, then AI',desc:'You wrote it, AI improved it.',how:'Your original Version A is shown below. Copy it with the improvement instructions, take that prompt to your AI platform, then paste the AI revision into Version D unchanged.'}
},GUESSES={human:'They wrote it',ai:'AI wrote it',both:'Both'};
let S={code:INITIAL_SESSION||'',session:null,joined:false,pid:'',drafts:{A:'',B:'',C:'',D:''},submitted:false,step:0,queue:null,idx:0,votes:{},voted:false,results:null,busy:false,msg:'',err:'',facMode:false,facToken:'',facSessions:[],facDash:null,makeNew:false},poller=null;
function call(fn,...args){return new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args))}
function esc(s){const d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}
function uid(){return Math.random().toString(36).slice(2,11)+Date.now().toString(36).slice(-5)}
function errText(e){return e&&e.message?e.message.replace(/^Exception:\s*/,''):String(e||'Something went wrong.')}
function sk(n){return`fv2_${S.code}_${n}`}
function saveLocal(){try{localStorage.setItem('fv2_pid',S.pid);if(S.code){localStorage.setItem('fv2_last_session',S.code);localStorage.setItem(sk('joined'),S.joined?'1':'0');localStorage.setItem(sk('drafts'),JSON.stringify(S.drafts));localStorage.setItem(sk('submitted'),S.submitted?'1':'0');localStorage.setItem(sk('voted'),S.voted?'1':'0')}if(S.facToken)sessionStorage.setItem('fv2_fac_token',S.facToken)}catch(e){}}
function loadLocal(){try{S.pid=localStorage.getItem('fv2_pid')||S.pid||uid();S.joined=localStorage.getItem(sk('joined'))==='1';S.submitted=localStorage.getItem(sk('submitted'))==='1';S.voted=localStorage.getItem(sk('voted'))==='1';const d=localStorage.getItem(sk('drafts'));if(d)S.drafts=JSON.parse(d)}catch(e){if(!S.pid)S.pid=uid()}if(!S.pid)S.pid=uid();saveLocal()}
function clearLocal(){try{['joined','drafts','submitted','voted'].forEach(k=>localStorage.removeItem(sk(k)))}catch(e){}S.joined=false;S.submitted=false;S.voted=false;S.drafts={A:'',B:'',C:'',D:''};S.votes={};S.queue=null;S.results=null;S.step=0}
async function loadSession(code){code=String(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(!code){S.code='';S.session=null;render();return}S.busy=true;S.err='';render();try{const r=await call('getSession',code);if(!r||!r.ok){S.session=null;S.code=code;S.err=r&&r.message||'Session not found.'}else{const changed=S.code!==r.code;S.code=r.code;S.session=r;if(changed){S.drafts={A:'',B:'',C:'',D:''};S.votes={};S.queue=null;S.results=null;S.submitted=false;S.voted=false;S.joined=false}loadLocal();await hydrate();startPolling()}}catch(e){S.err=errText(e)}S.busy=false;render()}
async function hydrate(){if(!S.session)return;if(S.session.phase==='vote'&&S.joined)S.queue=await call('getVoteQueue',S.code,S.pid);if(S.session.phase==='reveal')S.results=await call('getResults',S.code)}
function startPolling(){if(poller)clearInterval(poller);poller=setInterval(async()=>{if(S.busy)return;const waiting=S.facMode||(S.joined&&((S.session&&S.session.phase==='submit'&&S.submitted)||(S.session&&S.session.phase==='vote'&&S.voted)||(S.session&&S.session.phase==='reveal')));if(!waiting)return;try{if(S.facMode&&S.facToken&&S.code){S.facDash=await call('facilitatorDashboard',S.facToken,S.code);S.session=S.facDash.session;render();return}if(!S.code)return;const prev=S.session?S.session.phase:'',pv=S.session?S.session.poolVersion:'';const r=await call('getSession',S.code);if(r&&r.ok){S.session=r;if(r.phase!==prev||r.poolVersion!==pv){S.queue=null;S.idx=0;S.votes={};await hydrate()}render()}}catch(e){}},10000+Math.floor(Math.random()*2500))}
function straightAiPrompt(){return String(S.session&&S.session.prompt||'').trim()}
function improveAiPrompt(){return[
  'Improve the writing below while preserving my meaning and first-person point of view.',
  'Keep it within the original workshop requirements and approximately the same length.',
  'Make it clearer and more polished, but do not add personal experiences, examples, or ideas that are not already present.',
  'Return only the revised paragraph.',
  '',
  'WORKSHOP PROMPT:',
  String(S.session&&S.session.prompt||'').trim(),
  '',
  'MY ORIGINAL RESPONSE:',
  String(S.drafts.A||'').trim()
].join('\n')}
function aiStepCard(type){
  if(type==='B')return`<div class="card white"><strong>Use your AI platform</strong><ol class="steps"><li>Start a new chat in an AI tool you already use or your school provides.</li><li>Copy the exact workshop prompt below.</li><li>Paste it into the AI tool.</li><li>Copy the <strong>first response unchanged</strong> and paste it into Version B.</li></ol><button class="ghost" id="copyAiPromptBtn">Copy exact prompt for AI</button></div>`;
  if(type==='C')return`<div class="card white"><strong>Version B is already loaded below.</strong><p class="muted" style="margin:6px 0 0">Edit the text directly in the Version C box. Do not go back to the AI tool for this step—this version is the human edit.</p></div>`;
  if(type==='D')return`<div class="card white"><strong>Your original Version A</strong><div class="source">${esc(S.drafts.A||'')}</div><p class="muted">The button below copies this response together with instructions telling AI to improve the writing while preserving your ideas.</p><ol class="steps"><li>Click the copy button.</li><li>Start a new chat in an AI tool you already use.</li><li>Paste the copied prompt.</li><li>Copy the AI revision unchanged and paste it into Version D.</li></ol><button class="ghost" id="copyAiPromptBtn" ${(S.drafts.A||'').trim().length<20?'disabled':''}>Copy my Version A + improvement instructions</button></div>`;
  return''
}
function viewEntry(){if(!S.code||!S.session)return`<h1>Four Versions</h1><p class="sub">A live AI literacy activity</p><div class="card"><label for="joinCode">Session code</label><input id="joinCode" type="text" maxlength="8" placeholder="ABCDE" value="${esc(S.code)}"><button id="joinCodeBtn">Join session</button>${S.err?`<p class="err">${esc(S.err)}</p>`:''}</div><p class="muted" style="text-align:center"><a href="#" id="facLink">Facilitator</a></p>`;const closed=S.session.phase!=='submit';return`<h1>${esc(S.session.title)}</h1><p class="sub">Session ${esc(S.code)}</p><div class="card white"><label>Workshop prompt</label><div class="prompt">${esc(S.session.prompt)}</div></div><div class="card"><p>You'll make four versions of the same answer, then read other people's responses and decide who—or what—wrote them.</p><p class="muted">No Google sign-in is required for this activity. For the AI steps, use an AI platform you already have access to. We don't ask for your name; this browser gets a random participant ID used only for the activity.</p><button id="startBtn" ${closed?'disabled':''}>${closed?'This session has already started':'Start activity'}</button></div><p class="muted" style="text-align:center"><a href="#" id="changeSession">Use another session code</a> · <a href="#" id="facLink">Facilitator</a></p>`}
function viewSubmit(){if(S.submitted)return`<h1>You're in</h1><p class="sub">Session ${esc(S.code)}</p><div class="card dark"><h2>${Number(S.session.submissionCount||0)} submitted</h2><p>Look up when your facilitator is ready. Voting will open automatically.</p></div><button class="ghost" id="editBtn">Go back and edit my four versions</button>`;const t=ORDER[S.step],T=TYPES[t],filled=ORDER.filter(k=>(S.drafts[k]||'').trim().length>=20).length,dots=ORDER.map((k,i)=>`<span class="dot ${i===S.step?'here':((S.drafts[k]||'').trim().length>=20?'done':'')}"></span>`).join('');return`<h1>${esc(T.label)}</h1><p class="sub">Version ${S.step+1} of 4 · Session ${esc(S.code)}</p><div class="card white"><label>Same prompt for all four versions</label><div class="prompt">${esc(S.session.prompt)}</div></div><div class="progress">${dots}</div><div class="card"><p style="font-weight:700">${esc(T.desc)}</p><p class="muted">${esc(T.how)}</p>${aiStepCard(t)}<label for="txt">Version ${esc(t)}</label><textarea id="txt" maxlength="3000" placeholder="${t==='C'?'Edit the AI response here…':t==='D'?'Paste the AI-improved version here…':'Paste or write it here…'}"></textarea><div class="between" style="margin-top:12px"><div class="row"><button class="ghost inline" id="prevStep" ${S.step===0?'disabled':''}>Back</button><button class="ghost inline" id="nextStep" ${S.step===3?'disabled':''}>Next</button></div><span class="muted">${filled} of 4 ready</span></div><button class="accent" id="sendBtn" ${filled<4?'disabled':''}>${filled<4?'Complete all four versions':'Submit all four'}</button></div>`}
function viewVote(){const q=S.queue||[];if(!q.length)return`<h1>Voting</h1><p class="sub">Waiting for an assigned response set.</p><button class="ghost" id="syncBtn">Check again</button>`;if(S.voted)return`<h1>Votes are in</h1><p class="sub">You rated ${q.length} responses.</p><div class="card dark"><p>Look up. Your facilitator will reveal the answers when the room is ready.</p></div>`;const i=Math.min(S.idx,q.length-1),item=q[i],g=S.votes[item.id],answered=q.filter(x=>S.votes[x.id]).length,choices=Object.keys(GUESSES).map(k=>`<button class="choice ${g===k?'on':''}" data-guess="${k}">${esc(GUESSES[k])}</button>`).join('');return`<h1>Read it. Call it.</h1><p class="sub">${i+1} of ${q.length} · ${answered} answered</p><div class="resp"><span class="pill">Response ${item.n}</span><br><br>${esc(item.text)}</div><div class="choices">${choices}</div><div class="between" style="margin-top:15px"><div class="row"><button class="ghost inline" id="vPrev" ${i===0?'disabled':''}>Back</button><button class="ghost inline" id="vNext" ${i>=q.length-1?'disabled':''}>Next</button></div></div><button class="accent" id="voteDone" ${answered<q.length?'disabled':''}>${answered<q.length?'Rate all '+q.length+' to finish':'Submit my votes'}</button>`}
function resultRows(){const r=S.results;if(!r)return'';return r.pool.map(p=>{const t=r.tallies[p.id]||{human:0,ai:0,both:0},n=t.human+t.ai+t.both,pct=v=>n?Math.round(v/n*100):0,truth=p.type==='A'?'human':p.type==='B'?'ai':'both';return{p,t,n,pct,correct:pct(t[truth])}}).sort((a,b)=>a.correct-b.correct).map(({p,t,n,pct,correct})=>`<div class="resp"><span class="pill">Response ${p.n}</span> <span class="pill orange">Actually: ${esc(TYPES[p.type].short)}</span><br><br>${esc(p.text)}<div class="bar"><span style="width:${pct(t.human)}%;background:#142442"></span><span style="width:${pct(t.both)}%;background:#8894A8"></span><span style="width:${pct(t.ai)}%;background:#E8751A"></span></div><div class="muted">They wrote it ${pct(t.human)}% · Both ${pct(t.both)}% · AI ${pct(t.ai)}% · <strong>${correct}% called it right</strong> (${n} votes)</div></div>`).join('')}
function viewReveal(){if(!S.results)return`<h1>The reveal</h1><button class="ghost" id="syncBtn">Load results</button>`;return`<h1>The reveal</h1><p class="sub">${S.results.voters} people voted. Responses are sorted by how badly the room missed.</p><div class="card dark"><div class="big">${S.results.accuracy}%</div><p>of calls were correct. Chance alone is 33%.</p></div><div class="card"><h2>Debrief</h2><p>What cues did you use to decide something was AI? Which cues turned out to be unreliable? If polished writing isn't proof of authorship, what should we pay attention to instead?</p></div>${resultRows()}`}
function viewFacLogin(){return`<h1>Facilitator</h1><p class="sub">Controls are protected separately from the participant activity.</p><div class="card"><label for="facPass">Passphrase</label><input id="facPass" type="password"><button id="facLoginBtn">Enter facilitator mode</button></div><p class="muted" style="text-align:center"><a href="#" id="leaveFac">Back to participant view</a></p>`}
function viewFacHome(){if(S.makeNew||!S.code||!S.session){const sessions=(S.facSessions||[]).map(x=>`<div class="sessionItem between"><div><strong>${esc(x.title)}</strong><div class="muted">${esc(x.code)} · ${esc(x.phase)}</div></div><button class="ghost inline" data-open-session="${esc(x.code)}">Open</button></div>`).join('');return`<h1>Facilitator</h1><p class="sub">Create a workshop session, then share its participant link.</p><div class="card"><h2>New session</h2><label for="newTitle">Session title</label><input id="newTitle" type="text" maxlength="120" placeholder="AI Literacy Workshop"><label for="newPrompt" style="margin-top:12px">Prompt</label><textarea id="newPrompt" maxlength="2000" placeholder="What do you want participants to answer four different ways?"></textarea><button class="accent" id="createSessionBtn">Create session</button></div>${sessions?`<div class="card white"><h2>Recent sessions</h2>${sessions}</div>`:''}<p class="muted" style="text-align:center"><a href="#" id="leaveFac">Exit facilitator mode</a></p>`}const d=S.facDash;if(!d)return`<h1>Facilitator</h1><p class="sub">Loading dashboard…</p>`;const s=d.session;return`<div class="between"><div><h1>${esc(s.title)}</h1><p class="sub">Facilitator dashboard · ${esc(s.code)} · ${esc(s.phase)}</p></div><button class="ghost inline" id="newSessionBtn">New session</button></div><div class="card white"><label>Participant link</label><div class="sessionlink">${esc(d.participantUrl)}</div><button class="ghost" id="copyLinkBtn">Copy participant link</button></div><div class="card"><label>Prompt</label><div class="prompt">${esc(s.prompt)}</div></div><div class="statgrid"><div class="stat"><b>${Number(d.submissionCount||0)}</b><span class="muted">submitted</span></div><div class="stat"><b>${Number(d.poolCount||0)}</b><span class="muted">in pool</span></div><div class="stat"><b>${Number(d.voterCount||0)}</b><span class="muted">finished voting</span></div></div><div class="card white"><h2>Room controls</h2><button class="accent" id="facCloseBtn" ${s.phase!=='submit'?'disabled':''}>Close submissions & start voting</button><button id="facRevealBtn" ${s.phase!=='vote'?'disabled':''}>Reveal results</button><div class="row" style="margin-top:12px"><button class="ghost inline" id="facRefreshBtn">Refresh counts</button><button class="ghost inline" id="sheetBtn">Open data sheet</button><button class="ghost inline danger" id="facResetBtn">Reset this session</button></div></div><p class="muted" style="text-align:center"><a href="#" id="leaveFac">Exit facilitator mode</a></p>`}
function render(){let body;if(S.facMode)body=S.facToken?viewFacHome():viewFacLogin();else if(!S.joined)body=viewEntry();else if(S.session&&S.session.phase==='submit')body=viewSubmit();else if(S.session&&S.session.phase==='vote')body=viewVote();else if(S.session&&S.session.phase==='reveal')body=viewReveal();else body=viewEntry();if(S.msg)body+=`<p class="ok">${esc(S.msg)}</p>`;if(S.err&&S.session)body+=`<p class="err">${esc(S.err)}</p>`;if(S.busy)body+=`<p class="muted">Working…</p>`;document.getElementById('app').innerHTML=body;wire()}
function wire(){const $=id=>document.getElementById(id);if($('joinCodeBtn'))$('joinCodeBtn').onclick=()=>loadSession($('joinCode').value);if($('joinCode'))$('joinCode').onkeydown=e=>{if(e.key==='Enter')loadSession(e.target.value)};if($('changeSession'))$('changeSession').onclick=e=>{e.preventDefault();clearLocal();S.code='';S.session=null;history.replaceState({},'',location.pathname);render()};if($('facLink'))$('facLink').onclick=e=>{e.preventDefault();S.facMode=true;S.facToken=sessionStorage.getItem('fv2_fac_token')||'';render();if(S.facToken)loadFac()};if($('leaveFac'))$('leaveFac').onclick=e=>{e.preventDefault();S.facMode=false;S.makeNew=false;render()};if($('startBtn'))$('startBtn').onclick=()=>{S.joined=true;saveLocal();render()};if($('txt')){const cur=ORDER[S.step];$('txt').value=S.drafts[cur]||'';$('txt').oninput=e=>{S.drafts[cur]=e.target.value;saveLocal();renderButton()}}if($('copyAiPromptBtn'))$('copyAiPromptBtn').onclick=copyCurrentAiPrompt;if($('prevStep'))$('prevStep').onclick=()=>{S.step=Math.max(0,S.step-1);render()};if($('nextStep'))$('nextStep').onclick=()=>{if(ORDER[S.step]==='B'&&!(S.drafts.C||'').trim()&&(S.drafts.B||'').trim())S.drafts.C=S.drafts.B;S.step=Math.min(3,S.step+1);saveLocal();render()};if($('editBtn'))$('editBtn').onclick=()=>{S.submitted=false;S.step=0;saveLocal();render()};if($('sendBtn'))$('sendBtn').onclick=submitAllVersions;document.querySelectorAll('[data-guess]').forEach(b=>b.onclick=()=>{const q=S.queue||[];if(!q.length)return;const item=q[Math.min(S.idx,q.length-1)];S.votes[item.id]=b.dataset.guess;if(S.idx<q.length-1)S.idx++;render()});if($('vPrev'))$('vPrev').onclick=()=>{S.idx=Math.max(0,S.idx-1);render()};if($('vNext'))$('vNext').onclick=()=>{S.idx=Math.min((S.queue||[]).length-1,S.idx+1);render()};if($('voteDone'))$('voteDone').onclick=submitMyVotes;if($('syncBtn'))$('syncBtn').onclick=syncParticipant;if($('facLoginBtn'))$('facLoginBtn').onclick=facLogin;if($('createSessionBtn'))$('createSessionBtn').onclick=createSession;document.querySelectorAll('[data-open-session]').forEach(b=>b.onclick=()=>openFacSession(b.dataset.openSession));if($('newSessionBtn'))$('newSessionBtn').onclick=()=>{S.makeNew=true;render()};if($('facRefreshBtn'))$('facRefreshBtn').onclick=loadFac;if($('facCloseBtn'))$('facCloseBtn').onclick=facClose;if($('facRevealBtn'))$('facRevealBtn').onclick=facReveal;if($('facResetBtn'))$('facResetBtn').onclick=facReset;if($('copyLinkBtn'))$('copyLinkBtn').onclick=copyLink;if($('sheetBtn'))$('sheetBtn').onclick=()=>{if(S.facDash&&S.facDash.sheetUrl)window.open(S.facDash.sheetUrl,'_blank')}}
function renderButton(){const f=ORDER.filter(k=>(S.drafts[k]||'').trim().length>=20).length,b=document.getElementById('sendBtn');if(b){b.disabled=f<4;b.textContent=f<4?'Complete all four versions':'Submit all four'}}
async function copyText(text){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);return true}}catch(e){}try{const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');document.body.removeChild(ta);return ok}catch(e){return false}}
async function copyCurrentAiPrompt(){const type=ORDER[S.step],text=type==='B'?straightAiPrompt():type==='D'?improveAiPrompt():'';if(!text)return;const ok=await copyText(text);S.msg=ok?(type==='B'?'Prompt copied. Open a new chat in your AI platform, paste it, then bring the first response back here unchanged.':'Your Version A and the improvement instructions are copied. Paste them into a new AI chat, then bring the revised paragraph back here unchanged.'):'Copy failed. Select the workshop prompt manually and paste it into your AI platform.';render()}
async function submitAllVersions(){S.busy=true;S.err='';render();try{const r=await call('submitAll',S.code,S.pid,S.drafts);S.submitted=true;S.session.submissionCount=r.submissionCount;S.msg='All four versions are in.';saveLocal()}catch(e){S.err=errText(e)}S.busy=false;render()}
async function submitMyVotes(){S.busy=true;S.err='';render();try{await call('submitVotes',S.code,S.pid,S.votes);S.voted=true;S.msg='Votes recorded.';saveLocal()}catch(e){S.err=errText(e)}S.busy=false;render()}
async function syncParticipant(){S.busy=true;S.err='';render();try{const r=await call('getSession',S.code);if(r&&r.ok){S.session=r;await hydrate()}}catch(e){S.err=errText(e)}S.busy=false;render()}
async function facLogin(){const pass=document.getElementById('facPass').value;S.busy=true;S.err='';render();try{const r=await call('facilitatorLogin',pass);if(!r.ok)S.err=r.message||'Passphrase not recognized.';else{S.facToken=r.token;S.facSessions=r.sessions||[];S.makeNew=!S.code;saveLocal();await loadFac()}}catch(e){S.err=errText(e)}S.busy=false;render()}
async function loadFac(){if(!S.facToken)return;try{S.facSessions=await call('facilitatorListSessions',S.facToken);if(S.code&&!S.makeNew){S.facDash=await call('facilitatorDashboard',S.facToken,S.code);S.session=S.facDash.session}}catch(e){S.err=errText(e);if(/expired/i.test(S.err)){S.facToken='';sessionStorage.removeItem('fv2_fac_token')}}render()}
async function createSession(){const title=document.getElementById('newTitle').value,prompt=document.getElementById('newPrompt').value;S.busy=true;S.err='';render();try{const r=await call('facilitatorCreateSession',S.facToken,title,prompt);S.code=r.session.code;S.session=r.session;S.makeNew=false;history.replaceState({},'',location.pathname+'?s='+encodeURIComponent(S.code));S.facDash=await call('facilitatorDashboard',S.facToken,S.code);S.facSessions=await call('facilitatorListSessions',S.facToken);S.msg='Session created. Share the participant link.'}catch(e){S.err=errText(e)}S.busy=false;render();startPolling()}
async function openFacSession(code){S.code=code;S.makeNew=false;history.replaceState({},'',location.pathname+'?s='+encodeURIComponent(code));await loadFac();startPolling()}
async function facClose(){if(!confirm('Close submissions and start voting? Participants will no longer be able to submit.'))return;S.busy=true;S.err='';render();try{const r=await call('facilitatorCloseSubmissions',S.facToken,S.code);if(!r.ok)S.err=r.message;else S.msg=`Voting started with ${r.count} responses. Mix: A${r.mix.A} B${r.mix.B} C${r.mix.C} D${r.mix.D}.`;await loadFac()}catch(e){S.err=errText(e)}S.busy=false;render()}
async function facReveal(){S.busy=true;S.err='';render();try{await call('facilitatorReveal',S.facToken,S.code);S.msg='Results revealed to the room.';await loadFac()}catch(e){S.err=errText(e)}S.busy=false;render()}
async function facReset(){if(!confirm('Reset this session? This clears its submissions, pool, and votes.'))return;S.busy=true;S.err='';render();try{await call('facilitatorResetSession',S.facToken,S.code);S.msg='Session reset.';await loadFac()}catch(e){S.err=errText(e)}S.busy=false;render()}
async function copyLink(){const u=S.facDash&&S.facDash.participantUrl;if(!u)return;const ok=await copyText(u);S.msg=ok?'Participant link copied.':'Copy the participant link shown above.';render()}
(async function(){try{S.pid=localStorage.getItem('fv2_pid')||uid();S.facToken=sessionStorage.getItem('fv2_fac_token')||''}catch(e){S.pid=uid()}if(!S.code){try{S.code=localStorage.getItem('fv2_last_session')||''}catch(e){}}if(S.code)await loadSession(S.code);else render()})();
</script></body></html>
